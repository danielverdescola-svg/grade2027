// ---- rotinas da P. Infância: linha com o educador de cada dia (somente leitura) ----
function rotinaRow(slot) {
  let tr = '<tr><th class="hora">'+slot.time+'</th>';
  slot.row.forEach(c => {
    const eds = (c.eds||[]).join(' / ');
    tr += '<td><div class="rotina-pi"><b>'+(c.rotina||'')+'</b><br>'
       + (eds ? eds : '<span class="sem">sem educador</span>') + '</div></td>';
  });
  return tr + '</tr>';
}
// dica na célula: educador opcional que não coube (ex.: Julia no Inglês da P1)
function opcHint(cell) {
  return (cell.eds_opc_nao_usado && cell.eds_opc_nao_usado.length)
    ? '<div class="opc-hint">'+cell.eds_opc_nao_usado.join('/')+' não coube (conflito)</div>' : '';
}

// ---- ocupação REAL (oficinas editáveis + rotinas), por sobreposição de horário ----
function sobrepoe(a, b) { return a.some(x => b.some(y => x[0] < y[1] && y[0] < x[1])); }
function ocupacoes() {
  const L = [];
  DATA.turmas.forEach((tur, ti) => tur.slots.forEach((slot, si) => {
    if (slot.tipo === 'oficinas') {
      slot.row.forEach((cell, di) => { const ck = ti+'|'+si+'|'+di; const ed = valSel(ck);
        if (ed) L.push({ed, dia: diasOrd[di], ints: slot.ints, ck, txt: ed+': '+tur.key+' '+diasOrd[di]+' '+slot.time}); });
    } else if (slot.tipo === 'rotina_pi') {
      slot.row.forEach((cell, di) => (cell.eds||[]).forEach(ed =>
        L.push({ed, dia: diasOrd[di], ints: slot.ints, ck: null, txt: ed+': '+tur.key+' '+diasOrd[di]+' '+slot.time+' ('+cell.rotina+')'})));
    }
  }));
  return L;
}

function buildTurmas() {
  const cont = document.getElementById('turmas');
  const segs = {};
  DATA.turmas.forEach((t, gti) => { (segs[t.segmento] = segs[t.segmento] || []).push(gti); });
  Object.keys(segs).forEach(seg => {
    const h = document.createElement('h2');
    h.textContent = SEG_NOME[seg] || seg.toUpperCase();
    h.style.cssText = 'width:100%;margin:10px 0 2px;border-bottom:2px solid #176437;';
    cont.appendChild(h);
    segs[seg].forEach(gti => {
      const tur = DATA.turmas[gti];
      const ti = gti;
      const card = document.createElement('div');
      card.className = 'card';
      let tbl = '<table><tr><th class="hora">Horário</th>';
      diasOrd.forEach(dd => tbl += '<th class="day">'+diasNome[dd]+'</th>');
      tbl += '</tr>';
      tur.slots.forEach((slot, si) => {
        // slots que não são oficina: linha única de intervalo/rotina (só quando a turma tiver)
        if (slot.tipo === 'rotina_pi') { tbl += rotinaRow(slot); return; }
        if (slot.tipo !== 'oficinas') {
          const label = LABEL_TIPO[slot.tipo] || slot.tipo || '';
          tbl += '<tr><th class="hora">'+slot.time+'</th><td colspan="5" class="intervalo">'+label+'</td></tr>';
          return;
        }
        tbl += '<tr><th class="hora">'+slot.time+'</th>';
        slot.row.forEach((cell, di) => {
          const ck = ti+'|'+si+'|'+di;
          const eixo = cell.eixo || '';
          let edOpts = '<option value="">—</option>' + EDUC.map(e => '<option value="'+e+'" '+(cell.eds[0]===e?'selected':'')+'>'+e+'</option>').join('');
          let ofiOpts = OFICINAS.map(o => '<option value="'+o.replace(/"/g,'&quot;')+'" '+(o===cell.oficina?'selected':'')+'>'+o+'</option>').join('');
          tbl += '<td><div class="cell eixo-'+eixo+'" id="cell-'+ck+'">'
            + '<select class="ofi-sel" autocomplete="off" id="ofi-'+ck+'" data-ck="'+ck+'" onchange="ofiChanged(this.dataset.ck)">'+ofiOpts+'</select>'
            + '<select autocomplete="off" id="sel-'+ck+'" data-ck="'+ck+'" onchange="edChanged(this.dataset.ck)">'+edOpts+'</select>'
            + opcHint(cell) + '</div></td>';
        });
        tbl += '</tr>';
      });
      tbl += '</table>';
      card.innerHTML = '<h3>'+tur.key+' <span class="turno">'+(tur.turno==='MATUTINO'?'MATUTINO':'VESPERTINO')+'</span></h3>' + tbl;
      cont.appendChild(card);
    });
  });
}

function valSel(ck) { const s=document.getElementById('sel-'+ck); return s?s.value:''; }
function valOfi(ck) { const s=document.getElementById('ofi-'+ck); return s?s.value:''; }

function ofiChanged(ck) {
  const sel = document.getElementById('ofi-'+ck);
  if (!sel) return;
  const ofi = sel.value;
  const eixo = EIXO_OFICINA[ofi] || 'EMANCIPACAO';
  const cell = document.getElementById('cell-'+ck);
  cell.className = 'cell eixo-'+eixo;
  revalidate();
}

function edChanged(ck) { revalidate(); }

// ---- educadores LIVRES por horário (para células sem educador) ----
function slotInfo(ck) {
  const [ti, si, di] = ck.split('|').map(Number);
  const tur = DATA.turmas[ti];
  const slot = tur.slots[si];
  return {tur, slot, cell: slot.row[di], dia: diasOrd[di]};
}

// educadores ocupados num dia/horário (por SOBREPOSIÇÃO), sem contar a própria célula
function ocupadosEm(L, dia, ints, ckProprio) {
  const s = new Set();
  L.forEach(o => { if (o.dia === dia && o.ck !== ckProprio && sobrepoe(o.ints, ints)) s.add(o.ed); });
  return s;
}

function atualizarEdLivres() {
  const L = ocupacoes();
  document.querySelectorAll('select[id^="sel-"]').forEach(sel => {
    const ck = sel.dataset.ck;
    let info;
    try { info = slotInfo(ck); } catch (e) { return; }
    const ocup = ocupadosEm(L, info.dia, info.slot.ints, ck);
    const atual = sel.value;
    let opts = '<option value="">— (sem educador)</option>';
    EDUC.forEach(e => {
      // só mostra LIVRES no horário — mas SEMPRE mantém o já selecionado (mesmo em conflito)
      if (!ocup.has(e) || e === atual) {
        opts += '<option value="'+e+'">'+e+'</option>';
      }
    });
    sel.innerHTML = opts;
    sel.value = atual;
  });
}

// conflito = mesmo educador, mesmo dia, horários que se SOBREPÕEM (vale entre segmentos e com rotinas)
function conflitos() {
  const L = ocupacoes(), pares = [], cks = new Set(), linhas = new Set();
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const a = L[i], b = L[j];
    if (a.ed === b.ed && a.dia === b.dia && sobrepoe(a.ints, b.ints)) {
      pares.push([a, b]);
      if (a.ck) cks.add(a.ck); if (b.ck) cks.add(b.ck);
      linhas.add(a.txt); linhas.add(b.txt);
    }
  }
  return {unicas: pares.length, cks, linhas};
}

function revalidate() {
  atualizarEdLivres();
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('conf'));
  const res = conflitos();
  res.cks.forEach(ck => { const el = document.getElementById('cell-'+ck); if (el) el.classList.add('conf'); });
  document.getElementById('confResumo').innerHTML =
    '<span style="color:'+(res.unicas===0?'#27ae60':'#e74c3c')+'">'+res.unicas+' conflito(s)</span>';
  const ul = document.getElementById('confLista');
  ul.innerHTML = res.unicas===0 ? '<li style="color:#27ae60">Nenhum conflito</li>'
    : [...res.linhas].sort().map(x => '<li>'+x+'</li>').join('');
  mostraCarga();
  var pe = document.getElementById('porEducador');
  if (pe && pe.style.display !== 'none') buildEducadores();
  var se = document.getElementById('semEdCont');
  if (se && se.style.display !== 'none') buildSemEd();
}

function mostraCarga() {
  const acc = {};
  DATA.turmas.forEach((tur, ti) => {
    const turnoReal = (tur.turno==='MATUTINO') ? 'MANHA' : 'TARDE';
    tur.slots.forEach((slot, si) => { slot.row.forEach((cell, di) => {
      const ed = valSel(ti+'|'+si+'|'+di);
      if(!ed) return;
      acc[ed] = acc[ed] || {M:0, T:0};
      acc[ed][turnoReal==='MANHA'?'M':'T']++;
    }); });
  });
  let html = '<table class="carga-tab"><thead><tr>'
    + '<th>Educador</th><th class="num">M</th><th class="num">T</th><th class="num">Total</th>'
    + '</tr></thead><tbody>';
  EDUC.forEach(ed => {
    const nM = (acc[ed]||{}).M||0, nT = (acc[ed]||{}).T||0;
    html += '<tr><td>'+ed+'</td><td class="num">'+nM+'</td><td class="num">'+nT+'</td><td class="num">'+(nM+nT)+'</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('carga').innerHTML = html;
}

function calcSlotsSeg() {
  var SLOTS_SEG = {};
  DATA.turmas.forEach(function(t) {
    var key = t.segmento + '|' + (t.turno==='MATUTINO'?'MANHA':'TARDE');
    if (!SLOTS_SEG[key]) SLOTS_SEG[key] = t.slots.map(function(s){ return s.time; });
  });
  return SLOTS_SEG;
}

// "13h50 - 14h50" -> [830, 890] (minutos desde 0h)
function minutos(t) {
  return String(t).split('-').map(function(p){ var m = p.trim().split('h'); return (+m[0])*60 + (+(m[1]||0)); });
}
// Linhas da semana de um educador = os horários REAIS das oficinas dele, em ordem de início.
// (Infância e Adolescência têm horários diferentes à tarde; cada oficina vai na linha do seu horário.)
function linhasEducador(ocs) {
  var times = [];
  ocs.forEach(function(o){ if (times.indexOf(o.time) < 0) times.push(o.time); });
  times.sort(function(a,b){ var ma=minutos(a), mb=minutos(b); return (ma[0]-mb[0]) || (ma[1]-mb[1]); });
  var mapa = {};
  ocs.forEach(function(o){ var k = o.dia+'|'+times.indexOf(o.time); (mapa[k] = mapa[k] || []).push(o); });
  return {times: times, mapa: mapa};
}

// semana de cada educador: ed -> turno -> [oficinas (estado atual da aba Por turma) + rotinas da P. Infância]
function semanaPorEducador() {
  var occ = {};
  function add(ed, tu, o) { occ[ed] = occ[ed] || {}; (occ[ed][tu] = occ[ed][tu] || []).push(o); }
  DATA.turmas.forEach(function(tur, ti) {
    var tu = tur.turno==='MATUTINO'?'MANHA':'TARDE';
    tur.slots.forEach(function(slot, si) {
      slot.row.forEach(function(cell, di) {
        if (slot.tipo === 'rotina_pi') {
          (cell.eds||[]).forEach(function(ed){
            add(ed, tu, {dia: di, si: si, time: slot.time, turma: tur.key, seg: tur.segmento,
                         oficina: '(rotina) ' + cell.rotina, eixo: '', rotina: true, ck: null});
          });
          return;
        }
        if (slot.tipo !== 'oficinas') return;
        var ck = ti+'|'+si+'|'+di;
        var ed = valSel(ck);
        if (!ed) return;
        var ofi = valOfi(ck) || cell.oficina;
        add(ed, tu, {dia: di, si: si, time: slot.time, turma: tur.key, seg: tur.segmento,
                     oficina: ofi, eixo: EIXO_OFICINA[ofi] || cell.eixo, ck: ck});
      });
    });
  });
  return occ;
}

function buildEducadores() {
  var cont = document.getElementById('porEducador');
  if (!cont) return;
  cont.innerHTML = '';
  var SLOTS_SEG = calcSlotsSeg();
  var DIA_NOME = ['Seg','Ter','Qua','Qui','Sex'];
  var occ = semanaPorEducador();
  var CONF = conflitos().cks;
  EDUC.forEach(function(ed) {
    ['MANHA','TARDE'].forEach(function(tu) {
      var ocs = (occ[ed] && occ[ed][tu]) || [];
      if (!ocs.length) return;
      var nOf = ocs.filter(function(o){ return !o.rotina; }).length;
      var lin = linhasEducador(ocs), times = lin.times, mapa = lin.mapa;
      var card = document.createElement('div');
      card.className = 'card';
      var h = '<h3>' + ed + ' <span class="turno">' + tu + ' (' + nOf + ' oficinas)' + '</span></h3>';
      h += '<table><tr><th class="hora">Horário</th>';
      DIA_NOME.forEach(function(d){ h += '<th class="day">' + d + '</th>'; });
      h += '</tr>';
      times.forEach(function(t, si) {
        h += '<tr><th class="hora">' + t + '</th>';
        DIA_NOME.forEach(function(_, di) {
          var lst = mapa[di+'|'+si];
          if (lst) {
            // mais de uma oficina no mesmo horário = conflito: mostra todas, com borda vermelha
            h += '<td>' + lst.map(function(o){
              if (o.rotina) return '<div class="rotina-pi"><b>' + o.turma + '</b><br>' + o.oficina + '</div>';
              return '<div class="cell eixo-' + (o.eixo||'EMANCIPACAO') + ((CONF.has(o.ck) || lst.length>1)?' conf':'') + '"><div class="ofi-sel" style="margin:0;font-weight:600;">' + o.turma + '</div><div style="font-size:10px">' + o.oficina + '</div></div>';
            }).join('') + '</td>';
          } else {
            h += '<td></td>';
          }
        });
        h += '</tr>';
      });
      h += '</table>';
      card.innerHTML = h;
      cont.appendChild(card);
    });
  });
}

function buildSemEd() {
  const cont = document.getElementById('semEdCont');
  if (!cont) return;
  const OCC_L = ocupacoes();
  let nSem = 0;
  DATA.turmas.forEach((tur, ti) => {
    tur.slots.forEach((slot, si) => {
      if (slot.tipo !== 'oficinas') return;
      slot.row.forEach((cell, di) => {
        const ck = ti+'|'+si+'|'+di;
        if (!cell.oficina) return;
        if (!valSel(ck)) nSem++;
      });
    });
  });

  let html = '<div style="width:100%;margin:0 0 10px;font-size:13px;color:#555;">'
    + '<b>'+nSem+'</b> oficina(s) sem educador — células destacadas em roxo (mesmo layout da aba Por turma).</div>';
  if (!nSem) {
    cont.innerHTML = html + '<div style="background:#27ae60;color:#fff;border-radius:8px;padding:14px;font-weight:600;">✅ Nenhuma oficina sem educador!</div>';
    return;
  }

  const segs = {};
  DATA.turmas.forEach((t, gti) => { (segs[t.segmento] = segs[t.segmento] || []).push(gti); });
  Object.keys(segs).forEach(seg => {
    html += '<h2 style="width:100%;margin:10px 0 2px;border-bottom:2px solid #176437;">'+(SEG_NOME[seg] || seg.toUpperCase())+'</h2>';
    segs[seg].forEach(gti => {
      const tur = DATA.turmas[gti];
      const ti = gti;
      let tbl = '<table><tr><th class="hora">Horário</th>';
      diasOrd.forEach(dd => tbl += '<th class="day">'+diasNome[dd]+'</th>');
      tbl += '</tr>';
      tur.slots.forEach((slot, si) => {
        if (slot.tipo === 'rotina_pi') { tbl += rotinaRow(slot); return; }
        if (slot.tipo !== 'oficinas') {
          const label = LABEL_TIPO[slot.tipo] || slot.tipo || '';
          tbl += '<tr><th class="hora">'+slot.time+'</th><td colspan="5" class="intervalo">'+label+'</td></tr>';
          return;
        }
        tbl += '<tr><th class="hora">'+slot.time+'</th>';
        slot.row.forEach((cell, di) => {
          const ck = ti+'|'+si+'|'+di;
          // SEMPRE lê o estado ATUAL da aba Por turma (fonte única), nunca o DATA original
          const ofiAtual = valOfi(ck) || cell.oficina;
          const edAtual = valSel(ck);
          const eixo = EIXO_OFICINA[ofiAtual] || cell.eixo || 'EMANCIPACAO';
          const semEd = !edAtual;
          // célula em destaque (roxo) quando sem educador; senão esmaecida para dar contraste
          let classe = 'cell eixo-'+eixo + (semEd ? ' semed-dest' : ' semed-dim');
          let badge = semEd ? '<div class="semed-badge" style="background:'+EIXO_STYLE_COR[eixo]+';">SEM EDUC.</div>' : '';
          // educadores: só os LIVRES no horário (+ o atual, sempre visível)
          const ocup = ocupadosEm(OCC_L, diasOrd[di], slot.ints, ck);
          let edOpts = '<option value="">— (sem educador)</option>' + EDUC.filter(e => !ocup.has(e) || e===edAtual)
            .map(e => '<option value="'+e+'" '+(edAtual===e?'selected':'')+'>'+e+'</option>').join('');
          let ofiOpts = OFICINAS.map(o => '<option value="'+o.replace(/"/g,'&quot;')+'" '+(o===ofiAtual?'selected':'')+'>'+o+'</option>').join('');
          // IDs próprios (prefixo se-) para não duplicar os IDs da aba Por turma
          tbl += '<td><div class="'+classe+'" id="se-cell-'+ck+'">'
            + badge
            + '<select class="ofi-sel" autocomplete="off" id="se-ofi-'+ck+'" data-ck="'+ck+'" onchange="semEdOfi(this.dataset.ck, this.value)">'+ofiOpts+'</select>'
            + '<select autocomplete="off" id="se-sel-'+ck+'" data-ck="'+ck+'" onchange="semEdEd(this.dataset.ck, this.value)">'+edOpts+'</select>'
            + opcHint(cell) + '</div></td>';
        });
        tbl += '</tr>';
      });
      tbl += '</table>';  // sem isto o navegador joga o título da turma seguinte para cima desta tabela
      html += '<div class="card" style="margin-top:8px;"><h3>'+tur.key+' <span class="turno">'+(tur.turno==='MATUTINO'?'MATUTINO':'VESPERTINO')+'</span></h3>' + tbl + '</div>';
    });
  });
  cont.innerHTML = html;
}

// edições feitas na aba Sem educador gravam na aba Por turma (fonte única) e revalidam tudo
function semEdOfi(ck, v) {
  const s = document.getElementById('ofi-'+ck); if (!s) return;
  s.value = v; ofiChanged(ck);
}
function semEdEd(ck, v) {
  const s = document.getElementById('sel-'+ck); if (!s) return;
  s.value = v; edChanged(ck);
}

function mostrarAba(aba) {
  document.getElementById('turmas').style.display = (aba==='turmas') ? 'flex' : 'none';
  document.getElementById('porEducador').style.display = (aba==='educ') ? 'flex' : 'none';
  document.getElementById('semEdCont').style.display = (aba==='semed') ? 'flex' : 'none';
  if (aba === 'educ') buildEducadores();
  if (aba === 'semed') buildSemEd();
}

function escapeXml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var NL = String.fromCharCode(10);
function escapeXml2(s) {
  var nlre = new RegExp(String.fromCharCode(10), 'g');
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(nlre,'&#10;');
}

        p += '<Row ss:Height="60"><Cell ss:StyleID="hora"><Data ss:Type="String">' + escapeXml2(t) + '</Data></Cell>';
        DIA_NOME.forEach(function(_, di) {
          var lst = mapa[di+'|'+si];
          if (lst) {
            var st = EIXO_STYLE[lst[0].eixo] || 'cel';
            p += '<Cell ss:StyleID="' + st + '"><Data ss:Type="String">' + escapeXml2(lst.map(function(o){ return o.turma + ' | ' + o.oficina; }).join(' // ')) + '</Data></Cell>';
          } else {
            p += '<Cell ss:StyleID="cel"><Data ss:Type="String"></Data></Cell>';
          }
        });
        p += '</Row>';
      });
      p += '<Row ss:Height="8"><Cell/></Row>';
    });
  });
  p += '</Table></Worksheet>';

  var xml = '<?xml version="1.0" encoding="UTF-8"?>';
  xml += '<?mso-application progid="Excel.Sheet"?>';
  xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
  xml += '<Styles>' + STYLES + '</Styles>';
  xml += g + p;
  xml += '</Workbook>';
  var blob = new Blob(['﻿' + xml], {type:'application/vnd.ms-excel'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'grade2027_exportada.xls';
  a.click();
}

buildTurmas();
revalidate();
