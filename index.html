function buildTurmas() {
  const cont = document.getElementById('turmas');
  const segs = {};
  DATA.turmas.forEach((t, gti) => { (segs[t.segmento] = segs[t.segmento] || []).push(gti); });
  Object.keys(segs).forEach(seg => {
    const h = document.createElement('h2');
    h.textContent = seg.toUpperCase();
    h.style.cssText = 'width:100%;margin:10px 0 2px;border-bottom:2px solid #176437;';
    cont.appendChild(h);
    segs[seg].forEach(gti => {
      const tur = DATA.turmas[gti];
      const ti = gti;
      const card = document.createElement('div');
      card.className = 'card';
      let tbl = '<table><tr><th class="hora">Horário</th>';
      diasOrd.forEach(dd => tbl += '<th class="day">'+diasNome[dd]+'</th>');
      tbl += '</tr>';
      tur.slots.forEach((slot, si) => {
        tbl += '<tr><th class="hora">'+slot.time+'</th>';
        slot.row.forEach((cell, di) => {
          const ck = ti+'|'+si+'|'+di;
          const eixo = cell.eixo || '';
          let edOpts = '<option value="">—</option>' + EDUC.map(e => '<option value="'+e+'" '+(cell.eds[0]===e?'selected':'')+'>'+e+'</option>').join('');
          let ofiOpts = OFICINAS.map(o => '<option value="'+o.replace(/"/g,'&quot;')+'" '+(o===cell.oficina?'selected':'')+'>'+o+'</option>').join('');
          tbl += '<td><div class="cell eixo-'+eixo+'" id="cell-'+ck+'">'
            + '<select class="ofi-sel" autocomplete="off" id="ofi-'+ck+'" data-ck="'+ck+'" onchange="ofiChanged(this.dataset.ck)">'+ofiOpts+'</select>'
            + '<select autocomplete="off" id="sel-'+ck+'" data-ck="'+ck+'" onchange="edChanged(this.dataset.ck)">'+edOpts+'</select>'
            + '</div></td>';
        });
        tbl += '</tr>';
      });
      tbl += '</table>';
      card.innerHTML = '<h3>'+tur.key+' <span class="turno">'+(tur.turno==='MATUTINO'?'MATUTINO':'VESPERTINO')+'</span></h3>' + tbl;
      cont.appendChild(card);
    });
  });
}

function valSel(ck) { const s=document.getElementById('sel-'+ck); return s?s.value:''; }

let currentState = null;
let undoStack = [];

function capturarEstado() {
  const st = {};
  document.querySelectorAll('select[id^="ofi-"], select[id^="sel-"]').forEach(s => { st[s.id] = s.value; });
  return st;
}

function pushUndo() {
  if (currentState) {
    undoStack.push(currentState);
    if (undoStack.length > 100) undoStack.shift();
  }
  currentState = capturarEstado();
}

function edChanged(ck) {
  pushUndo();
  revalidate();
}

function undo() {
  if (!undoStack.length) { alert('Nada para voltar.'); return; }
  currentState = undoStack.pop();
  for (const id in currentState) {
    const el = document.getElementById(id);
    if (el) el.value = currentState[id];
  }
  document.querySelectorAll('.cell').forEach(c => {
    const ck = c.id.replace('cell-','');
    const ofiEl = document.getElementById('ofi-'+ck);
    const eixo = ofiEl ? (EIXO_OFICINA[ofiEl.value] || 'EMANCIPACAO') : 'EMANCIPACAO';
    c.className = 'cell eixo-'+eixo;
  });
  revalidate();
}

function restaurar() {
  if (confirm('Restaurar a grade padrão? As alterações desta sessão serão perdidas.')) {
    location.reload();
  }
}

function gerarNovo() {
  pushUndo();
  const mapa = {};
  DATA.turmas.forEach(t => t.slots.forEach(s => s.row.forEach(c => {
    if (c.oficina && c.eds.length) {
      (mapa[c.oficina] = mapa[c.oficina] || new Set()).add(c.eds[0]);
    }
  })));
  DATA.turmas.forEach((tur, ti) => {
    tur.slots.forEach((slot, si) => { slot.row.forEach((cell, di) => {
      const ck = ti+'|'+si+'|'+di;
      const edSel = document.getElementById('sel-'+ck);
      if (edSel.value) return;
      const ofi = document.getElementById('ofi-'+ck).value;
      const cands = Array.from(mapa[ofi] || []);
      for (let i = cands.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cands[i], cands[j]] = [cands[j], cands[i]];
      }
      for (const ed of cands) {
        edSel.value = ed;
        if (!conflitos().ed.has(ed)) break;
        edSel.value = '';
      }
    }); });
  });
  currentState = capturarEstado();
  revalidate();
}

function ofiChanged(ck) {
  const sel = document.getElementById('ofi-'+ck);
  if (!sel) return;
  const ofi = sel.value;
  const eixo = EIXO_OFICINA[ofi] || 'EMANCIPACAO';
  const cell = document.getElementById('cell-'+ck);
  cell.className = 'cell eixo-'+eixo;
  pushUndo();
  revalidate();
}

function conflitos() {
  const ev = {};
  DATA.turmas.forEach((tur, ti) => {
    tur.slots.forEach((slot, si) => {
      slot.row.forEach((cell, di) => {
        const ed = valSel(ti+'|'+si+'|'+di);
        if(!ed) return;
        const key = ed+'|'+diasOrd[di]+'|'+slot.start+'|'+slot.end;
        if(!(key in ev)) ev[key] = [];
        ev[key].push({turma:tur.key, time:slot.time, dia:diasOrd[di]});
      });
    });
  });
  const lista = [];
  for (const k in ev) if (ev[k].length>1) {
    for (let i=0;i<ev[k].length;i++) for (let j=i+1;j<ev[k].length;j++) {
      lista.push(k.split('|')[0]+': '+ev[k][i].turma+' x '+ev[k][j].turma+' ('+ev[k][i].dia+' '+ev[k][i].time+')');
    }
  }
  const conflictEd = new Set();
  lista.forEach(l => conflictEd.add(l.split(':')[0]));
  return {unicas: lista.length, ed: conflictEd};
}

function revalidate() {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('conf'));
  const res = conflitos();
  DATA.turmas.forEach((tur, ti) => {
    tur.slots.forEach((slot, si) => {
      slot.row.forEach((cell, di) => {
        const ck = ti+'|'+si+'|'+di;
        const ed = valSel(ck);
        if (ed && res.ed.has(ed)) document.getElementById('cell-'+ck).classList.add('conf');
      });
    });
  });
  document.getElementById('confResumo').innerHTML =
    '<span style="color:'+(res.unicas===0?'#27ae60':'#e74c3c')+'">'+res.unicas+' conflito(s)</span>';
  const ul = document.getElementById('confLista');
  ul.innerHTML = (res.unicas===0 ? '<li style="color:green">Nenhum conflito</li>' : (function(){
    const set = new Set();
    const ev = {};
    DATA.turmas.forEach((tur, ti) => {
      tur.slots.forEach((slot, si) => { slot.row.forEach((cell, di) => {
        const ed = valSel(ti+'|'+si+'|'+di); if(!ed) return;
        const key = ed+'|'+diasOrd[di]+'|'+slot.start+'|'+slot.end;
        if(!(key in ev)) ev[key]=[];
        ev[key].push(ed+': '+tur.key+' '+diasOrd[di]+' '+slot.time);
      }); });
    });
    for(const k in ev) if(ev[k].length>1) ev[k].forEach(x=>set.add(x));
    let arr=[]; set.forEach(x=>arr.push('<li>'+x+'</li>'));
    return arr.join('');
  })());
  mostraCarga();
}

function mostraCarga() {
  const acc = {};
  DATA.turmas.forEach((tur, ti) => {
    const turnoReal = (tur.turno==='MATUTINO') ? 'MANHA' : 'TARDE';
    tur.slots.forEach((slot, si) => { slot.row.forEach((cell, di) => {
      const ed = valSel(ti+'|'+si+'|'+di);
      if(!ed) return;
      acc[ed] = acc[ed] || {MANHA:0, TARDE:0};
      acc[ed][turnoReal]++;
    }); });
  });
  let html = '<table class="carga-tab"><colgroup>'
    + '<col style="width:130px"><col style="width:120px"><col style="width:50px"><col style="width:130px">'
    + '</colgroup><thead><tr>'
    + '<th>Educador</th><th>M | T (real/meta)</th><th>Multi</th><th>Total / meta</th>'
    + '</tr></thead><tbody>';
  EDUC.forEach(ed => {
    const nM = (acc[ed]||{}).MANHA||0, nT = (acc[ed]||{}).TARDE||0;
    const m = DATA.metas[ed] || {};
    const oM = (m.MANHA||{}).ofic||0, oT = (m.TARDE||{}).ofic||0;
    const mM = (m.MANHA||{}).multi||0, mT = (m.TARDE||{}).multi||0;
    const tot = nM+nT, meta = oM+oT;
    const multiTot = mM+mT;
    let st;
    if (!meta) {
      st = '<span class="mute">manual</span>';
    } else if (tot===meta) {
      st = '<span class="okg">'+tot+'/'+meta+'</span>';
    } else {
      const dif = meta-tot;
      st = '<span class="diff">'+tot+'/'+meta+' ('+(dif>0?'faltam ':'sobram ')+Math.abs(dif)+')</span>';
    }
    const mtxt = '<span>'+(oM? nM+'/'+oM : nM)+' | '+(oT? nT+'/'+oT : nT)+'</span>';
    html += '<tr><td>'+ed+'</td><td class="num">'+mtxt+'</td><td class="num">'+multiTot+'</td><td class="num">'+st+'</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('carga').innerHTML = html;
}

    '<Style ss:ID="titulo"><Font ss:Bold="1" ss:Size="14"/><Interior ss:Color="#176437" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>'
    + '<Style ss:ID="turma"><Font ss:Bold="1" ss:Size="12"/><Interior ss:Color="#DDE7F0" ss:Pattern="Solid"/><Alignment ss:Horizontal="Left" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="2"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>'
    + '<Style ss:ID="cab"><Font ss:Bold="1"/><Interior ss:Color="#DDE7F0" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="hora"><Font ss:Bold="1"/><Alignment ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="cel"><Alignment ss:WrapText="1" ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="conv"><Interior ss:Color="#73A186" ss:Pattern="Solid"/><Alignment ss:WrapText="1" ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="pert"><Interior ss:Color="#8EAADB" ss:Pattern="Solid"/><Alignment ss:WrapText="1" ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="ampl"><Interior ss:Color="#FFC000" ss:Pattern="Solid"/><Alignment ss:WrapText="1" ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="eman"><Interior ss:Color="#FFFFFF" ss:Pattern="Solid"/><Alignment ss:WrapText="1" ss:Vertical="Top"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="multi"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#C55A11" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="plan"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#7F7F7F" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>';

  // ---------- ABA 1: GRADE ----------
  var g = '<Worksheet ss:Name="Grade 2027"><Table>';
  g += '<Column ss:Width="90"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/>';
  g += '<Row ss:Height="30"><Cell ss:MergeAcross="5" ss:StyleID="titulo"><Data ss:Type="String">GRADE 2027 &mdash; VERDESCOLA</Data></Cell></Row>';
  DATA.turmas.forEach(function(tur, ti) {
    var tx = tur.key + '  (' + (tur.turno==='MATUTINO'?'Matutino':'Vespertino') + ')';
    g += '<Row ss:Height="22"><Cell ss:MergeAcross="5" ss:StyleID="turma"><Data ss:Type="String">' + escapeXml2(tx) + '</Data></Cell></Row>';
    g += '<Row ss:Height="18"><Cell ss:StyleID="cab"><Data ss:Type="String">Horario</Data></Cell>'
      + ['Segunda','Terça','Quarta','Quinta','Sexta'].map(function(d){ return '<Cell ss:StyleID="cab"><Data ss:Type="String">' + d + '</Data></Cell>'; }).join('')
      + '</Row>';
    tur.slots.forEach(function(slot, si) {
      g += '<Row ss:Height="60"><Cell ss:StyleID="hora"><Data ss:Type="String">' + escapeXml2(slot.time) + '</Data></Cell>';
      slot.row.forEach(function(cell, di) {
        var ck = ti+'|'+si+'|'+di;
        var ofi = valOfi(ck);
        var ed = valSel(ck);
        var eixo = EIXO_OFICINA[ofi] || (cell.eixo || 'EMANCIPACAO');
        var st = EIXO_STYLE[eixo] || 'cel';
        var txt = ofi || '';
        if (ed) txt += NL + ed;
        g += '<Cell ss:StyleID="' + st + '"><Data ss:Type="String">' + escapeXml2(txt) + '</Data></Cell>';
      });
      g += '</Row>';
    });
    g += '<Row ss:Height="8"><Cell/></Row>';
  });
  g += '</Table></Worksheet>';

  // ---------- ABA 2: PLANEJAMENTO (mesmo layout da grade, por educador) ----------
  var SLOTS_SEG = {};
  DATA.turmas.forEach(function(t) {
    var key = t.segmento + '|' + (t.turno==='MATUTINO'?'MANHA':'TARDE');
    if (!SLOTS_SEG[key]) SLOTS_SEG[key] = t.slots.map(function(s){ return s.time; });
  });
  var DIA_NOME = ['Seg','Ter','Qua','Qui','Sex'];
  var occ = {};
  DATA.turmas.forEach(function(tur, ti) {
    var tu = tur.turno==='MATUTINO'?'MANHA':'TARDE';
    tur.slots.forEach(function(slot, si) {
      slot.row.forEach(function(cell, di) {
        var ck = ti+'|'+si+'|'+di;
        var ed = valSel(ck);
        if (!ed) return;
        if (!occ[ed]) occ[ed] = {};
        if (!occ[ed][tu]) occ[ed][tu] = [];
        occ[ed][tu].push({dia: di, si: si, turma: tur.key, seg: tur.segmento,
                          oficina: valOfi(ck) || cell.oficina, eixo: EIXO_OFICINA[valOfi(ck)] || cell.eixo});
      });
    });
  });
  var p = '<Worksheet ss:Name="Planejamento"><Table>';
  p += '<Column ss:Width="90"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/><Column ss:Width="160"/>';
  p += '<Row ss:Height="30"><Cell ss:MergeAcross="5" ss:StyleID="titulo"><Data ss:Type="String">CARGA POR EDUCADOR</Data></Cell></Row>';
  EDUC.forEach(function(ed) {
    var m = DATA.metas[ed] || {};
    ['MANHA','TARDE'].forEach(function(tu) {
      var info = m[tu];
      if (!info) return;
      if (!info.ofic && !info.multi && !info.plan) return;
      var ocs = (occ[ed] && occ[ed][tu]) || [];
      var contSeg = {};
      ocs.forEach(function(o){ contSeg[o.seg] = (contSeg[o.seg]||0)+1; });
      var seg = Object.keys(contSeg).sort(function(a,b){ return (contSeg[b]||0)-(contSeg[a]||0); })[0] || 'Infancia';
      var times = SLOTS_SEG[seg+'|'+tu] || ['7h50 - 8h40','8h40 - 9h30','9h30 - 10h20'];
      var mapa = {};
      ocs.forEach(function(o){ mapa[o.dia+'|'+o.si] = o; });
      var metaOfi = info.ofic||0, metaMulti = info.multi||0, metaPlan = info.plan||0;
      var multiAlvo = metaMulti, planRest = metaPlan;
      p += '<Row ss:Height="22"><Cell ss:MergeAcross="5" ss:StyleID="turma"><Data ss:Type="String">' + escapeXml2(ed + ' - ' + tu) + '</Data></Cell></Row>';
      p += '<Row ss:Height="18"><Cell ss:MergeAcross="5" ss:StyleID="cel"><Data ss:Type="String">' + escapeXml2('Oficinas: ' + ocs.length + '/' + metaOfi + '   |   Multi: ' + metaMulti + '   |   Planejamento: ' + metaPlan) + '</Data></Cell></Row>';
      p += '<Row ss:Height="18"><Cell ss:StyleID="cab"><Data ss:Type="String">Horario</Data></Cell>'
        + ['Segunda','Terça','Quarta','Quinta','Sexta'].map(function(d){ return '<Cell ss:StyleID="cab"><Data ss:Type="String">' + d + '</Data></Cell>'; }).join('')
        + '</Row>';
      times.forEach(function(t, si) {
        p += '<Row ss:Height="60"><Cell ss:StyleID="hora"><Data ss:Type="String">' + escapeXml2(t) + '</Data></Cell>';
        DIA_NOME.forEach(function(_, di) {
          var o = mapa[di+'|'+si];
          if (o) {
            var st = EIXO_STYLE[o.eixo] || 'cel';
            p += '<Cell ss:StyleID="' + st + '"><Data ss:Type="String">' + escapeXml2(o.turma + ' | ' + o.oficina) + '</Data></Cell>';
          } else if (multiAlvo > 0) {
            multiAlvo--;
            p += '<Cell ss:StyleID="multi"><Data ss:Type="String">MULTI</Data></Cell>';
          } else if (planRest > 0) {
            planRest--;
            p += '<Cell ss:StyleID="plan"><Data ss:Type="String">PLANEJAMENTO</Data></Cell>';
          } else {
            p += '<Cell ss:StyleID="cel"><Data ss:Type="String"></Data></Cell>';
          }
        });
        p += '</Row>';
      });
      p += '<Row ss:Height="8"><Cell/></Row>';
    });
  });
  p += '</Table></Worksheet>';

  var xml = '<?xml version="1.0" encoding="UTF-8"?>';
  xml += '<?mso-application progid="Excel.Sheet"?>';
  xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
  xml += '<Styles>' + STYLES + '</Styles>';
  xml += g + p;
  xml += '</Workbook>';
  var blob = new Blob(['﻿' + xml], {type:'application/vnd.ms-excel'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'grade2027_exportada.xls';
  a.click();
}

buildTurmas();
currentState = capturarEstado();
revalidate();
</script></body></html>
